<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skillfleet logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101d33"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="mark" x1="56" y1="72" x2="208" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38e1ff"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#38e1ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38e1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#bg)"/>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#glow)"/>
  <rect x="5.5" y="5.5" width="245" height="245" rx="54.5" stroke="#3e5a7d" stroke-opacity="0.55" stroke-width="3"/>

  <!-- routes: one library fanning out to endpoints -->
  <g stroke="url(#mark)" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M78 128 C 112 128, 118 76, 158 72"/>
    <path d="M78 128 L 162 128"/>
    <path d="M78 128 C 112 128, 118 180, 158 184"/>
  </g>

  <!-- fleet: arrowheads underway -->
  <g fill="url(#mark)">
    <path d="M158 54 L 200 72 L 158 90 L 168 72 Z"/>
    <path d="M162 110 L 204 128 L 162 146 L 172 128 Z"/>
    <path d="M158 166 L 200 184 L 158 202 L 168 184 Z"/>
  </g>

  <!-- library hub -->
  <circle cx="66" cy="128" r="21" fill="#0a1220" stroke="url(#mark)" stroke-width="11"/>
</svg>
