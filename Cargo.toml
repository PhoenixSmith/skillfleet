[package]
name = "skillfleet"
version = "0.1.0"
edition = "2024"
description = "Git-backed skill routing for AI agent runtimes"
license = "MIT"
repository = "https://github.com/PhoenixSmith/skillfleet"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
